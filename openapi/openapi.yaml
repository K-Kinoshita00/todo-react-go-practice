openapi: 3.0.3

info:
  title: Todo API
  version: 0.1.1
  description: Todo API

servers:
  - url: 'http://localhost:8080'

tags:
  - name: Health
  - name: Todo

paths:
  /health:
    get:
      summary: Health Application check
      tags:
        - Health
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                    description: Status of the application

  /todos:
    get:
      operationId: listTodos
      summary: list Todos
      tags:
        - Todo
      parameters:
        - $ref: './parameters/pagination.yaml#/PageNumber'
        - $ref: './parameters/pagination.yaml#/PageSize'
      responses:
        200:
          $ref: './responses/todo.yaml#/TodoWithPagination'
        400:
          $ref: './responses/error.yaml#/BadRequest'
        default:
          $ref: './responses/error.yaml#/InternalServerError'

    post:
      operationId: createTodo
      summary: create Todo
      tags:
        - Todo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './parameters/todo.yaml#/CreateTodo'
      responses:
        201:
          $ref: './responses/success.yaml#/Created'
        400:
          $ref: './responses/error.yaml#/BadRequest'
        default:
          $ref: './responses/error.yaml#/InternalServerError'

  /todos/{id}:
    get:
      operationId: getTodoByID
      summary: get Todo By ID
      tags:
        - Todo
      parameters:
        - $ref: './parameters/id.yaml#/ID'
      responses:
        200:
          $ref: './responses/todo.yaml#/TodoObjective'
        404:
          $ref: './responses/error.yaml#/NotFound'
        default:
          $ref: './responses/error.yaml#/InternalServerError'

    patch:
      operationId: updateTodo
      summary: update Todo
      tags:
        - Todo
      parameters:
        - $ref: './parameters/id.yaml#/ID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './parameters/todo.yaml#/UpdateTodo'
      responses:
        204:
          $ref: './responses/success.yaml#/NoContent'
        400:
          $ref: './responses/error.yaml#/BadRequest'
        404:
          $ref: './responses/error.yaml#/NotFound'
        default:
          $ref: './responses/error.yaml#/InternalServerError'

    delete:
      operationId: deleteTodo
      summary: delete Todo
      tags:
        - Todo
      parameters:
        - $ref: './parameters/id.yaml#/ID'
      responses:
        204:
          $ref: './responses/success.yaml#/NoContent'
        404:
          $ref: './responses/error.yaml#/NotFound'
        default:
          $ref: './responses/error.yaml#/InternalServerError'
