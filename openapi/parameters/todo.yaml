CreateTodoObjective:
  type: object
  required:
    - title
    - status
  properties:
    title:
      type: string
    status:
      type: string
      enum:
        - not_started
        - in_progress
        - completed
        - archive

UpdateTodoObjective:
  type: object
  required:
    - id
    - title
    - status
  properties:
    id:
      type: string
      format: uuid
    title:
      type: string
    status:
      type: string
      enum:
        - not_started
        - in_progress
        - completed
        - archive