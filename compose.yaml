services:
  database:
    image: postgres:17.5
    ports:
      - ${POSTGRES_PORT}:5432
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes: # データベースのデータを保存するボリューム
      - database_data:/var/lib/postgresql/data
    healthcheck:
      test:
        ['CMD', 'pg_isready', '-U', '${POSTGRES_USER}', '-d', '${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - ${API_PORT}:8080
    depends_on:
      - database

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - ${WEB_PORT}:5173

  swagger-ui:
    image: swaggerapi/swagger-ui:v5.32.14
    ports:
      - ${SWAGGER_UI_PORT}:8080
    environment:
      - SWAGGER_JSON=/openapi/openapi.yaml
    volumes:
      - ./openapi:/openapi

  migrate:
    image: flyway/flyway:13.4.0
    command: migrate
    volumes:
      - ./database/migrations:/flyway/sql # 公式の読み取り先
    environment:
      - FLYWAY_URL=jdbc:postgresql://database:5432/${POSTGRES_DB}
      - FLYWAY_USER=${POSTGRES_USER}
      - FLYWAY_PASSWORD=${POSTGRES_PASSWORD}
    depends_on:
      database:
        condition: service_healthy
    profiles:
      - migrate # このサービスを up から外す

volumes:
  database_data:
