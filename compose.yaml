services:
  database:
    image: postgres:17.5
    ports:
      - ${POSTGRES_PORT}:5432
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes: # データベースのデータを保存するボリューム
      - database_data:/var/lib/postgresql/data

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - ${API_PORT}:8080
    depends_on:
      - database

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - ${WEB_PORT}:5173

volumes:
  database_data: