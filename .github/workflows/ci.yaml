name: CI

on:
  pull_request:
    branches: [main, develop, production]

env:
  POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
  POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
  POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
  POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
  POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
  WEB_PORT: ${{ secrets.WEB_PORT }}
  API_PORT: ${{ secrets.API_PORT }}
  SWAGGER_UI_PORT: ${{ secrets.SWAGGER_UI_PORT }}
  JWT_SECRET: ${{ secrets.JWT_SECRET }}
  JWKS_URL: ${{ secrets.JWKS_URL }}
  JWT_ISSUER: ${{ secrets.JWT_ISSUER }}
  JWT_AUDIENCE: ${{ secrets.JWT_AUDIENCE }}
  AUTH_MODE: ${{ secrets.AUTH_MODE }}
  CORS_ORIGIN: ${{ secrets.CORS_ORIGIN }}
  VITE_COGNITO_USER_POOL_ID: ${{ secrets.VITE_COGNITO_USER_POOL_ID }}
  VITE_COGNITO_CLIENT_ID: ${{ secrets.VITE_COGNITO_CLIENT_ID }}

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      - run: make lint
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      - run: |
          make up
          make migrate
          cd web && pnpm run test
          cd ../api && go test ./... -count=1
  e2e:
    runs-on: ubuntu-24.04
    env:
      E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      - run: |
          make up
          make migrate
          make test-e2e-setup
          cd web &&  pnpm run test:e2e
