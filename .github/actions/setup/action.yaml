name: Setup
description: Go, pnpm, Node
runs:
  using: composite
  steps:
    - uses: actions/setup-go@v7.0.0
      with:
        go-version-file: api/go.mod
    - uses: actions/setup-node@v7.0.0
      with:
        node-version: '26.0.0'
    - uses: pnpm/setup@v3.0.0
      with:
        version: 12.4.1
        working-directory: web
